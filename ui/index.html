<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Blazon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" aria-hidden="true"></div>

  <div id="edge" class="edge"></div>
  <aside id="sidebar">
    <header class="topbar" data-tauri-drag-region>
      <button class="icon" data-nav="back" data-i="back" title="Voltar (Alt+←)"></button>
      <button class="icon" data-nav="forward" data-i="forward" title="Avançar (Alt+→)"></button>
      <button class="icon" id="reload" data-nav="reload" data-i="reload" title="Recarregar (F5)"></button>
      <button class="icon" id="shield" data-i="shield" title="Bloqueador de anúncios"></button>
      <button class="icon" id="reader" data-i="book" title="Modo leitura"></button>
      <div class="grow" data-tauri-drag-region></div>
      <div id="winctl" class="winctl">
        <button class="icon" id="win-min" data-i="min" title="Minimizar"></button>
        <button class="icon" id="win-max" data-i="max" title="Maximizar"></button>
        <button class="icon close" id="win-close" data-i="x" title="Fechar"></button>
      </div>
    </header>

    <form id="address-form" class="address">
      <span class="lead" data-i="search"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Pesquisar ou digitar endereço">
      <ul id="suggest" class="suggest" hidden></ul>
    </form>

    <div id="pinned" class="pinned" role="toolbar" aria-label="Fixadas"></div>

    <div class="space-head">
      <button id="space-name" class="space-name" title="Editar Space"></button>
      <button id="space-menu" class="icon" data-i="more" title="Editar Space"></button>
    </div>

    <div class="scroll" id="scroll">
      <ul id="folders" class="tabs" role="tree" aria-label="Pastas"></ul>
      <button id="new-tab" class="row new-tab" title="Nova aba (Ctrl+T)"><span data-i="plus"></span>Nova aba</button>
      <ul id="tabs" class="tabs" role="listbox" aria-label="Abas"></ul>
    </div>

    <div id="now-playing" class="now-playing" hidden aria-label="Tocando agora"></div>
    <footer data-tauri-drag-region>
      <button id="settings-btn" class="icon" data-i="gear" title="Configurações"></button>
      <div class="switcher">
        <div id="spaces" class="spaces"></div>
        <button id="add-space" class="icon" data-i="plus" title="Novo Space"></button>
      </div>
      <div class="foot-right">
        <button id="downloads-btn" class="icon" data-i="download" title="Downloads"><span id="dl-badge" class="badge" hidden></span></button>
        <button id="history-btn" class="icon" data-i="archive" title="Arquivo e histórico (Ctrl+H)"></button>
      </div>
    </footer>
  </aside>


  <dialog id="history">
    <form method="dialog">
      <div class="seg-tabs"><button type="button" id="ht-archive" class="sel">Arquivo</button><button type="button" id="ht-history">Histórico</button></div>
      <input id="history-q" type="search" placeholder="Pesquisar">
      <ul id="history-list" class="history-list"></ul>
      <menu>
        <button type="button" id="history-clear" class="danger">Limpar</button>
        <button value="ok" class="primary">Fechar</button>
      </menu>
    </form>
  </dialog>

  <dialog id="downloads">
    <form method="dialog">
      <h3>Downloads</h3>
      <ul id="dl-list" class="dl-list"></ul>
      <menu><button type="button" id="dl-clear" class="danger">Limpar concluídos</button><button value="ok" class="primary">Fechar</button></menu>
    </form>
  </dialog>
  <dialog id="folder-dialog">
    <form method="dialog">
      <h3>Cor e ícone da pasta</h3>
      <div id="fd-colors" class="swatches"></div>
      <label>Ícone (um emoji) <input id="fd-icon" type="text" maxlength="4" placeholder="📁"></label>
      <menu><button type="button" id="fd-reset">Padrão</button><button value="save" class="primary">Salvar</button></menu>
    </form>
  </dialog>
  <div id="ctx" class="ctx" hidden></div>
  <div id="toast" class="toast" hidden><span id="toast-text"></span><span class="toast-actions" id="toast-actions"></span></div>
  <script src="i18n.js"></script>
  <script src="diag.js"></script>
  <script src="houses.js"></script>
  <script src="charges.js"></script>
  <script src="crest.js"></script>
  <script src="app.js"></script>
</body>
</html>
