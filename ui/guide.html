<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Primeiros passos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="motion.css">
  <style>
    html, body { overflow: auto; height: auto; min-height: 100%; }
    body { user-select: none; background: var(--c0); }
    .page { display: grid; grid-template-columns: 230px 1fr; gap: 36px; max-width: 1040px; margin: 0 auto; padding: 40px 32px 60px; }
    @media (max-width: 760px) { .page { grid-template-columns: 1fr; } }
    .chapters h1 { font: 600 22px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 0 0 4px; }
    .chapters p { color: var(--muted); margin: 0 0 18px; font-size: 12px; }
    .chapters button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; color: var(--muted); }
    .chapters button.on { background: var(--active); color: var(--fg); }
    .chapters .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--faint); flex: none; }
    .chapters .done .n { background: var(--c2); color: var(--c0); }
    .lesson { min-width: 0; }
    .eyebrow { color: var(--c2); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
    .lesson h2 { font: 600 26px/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 4px 0 8px; }
    .lesson .lead { color: var(--muted); line-height: 1.55; margin: 0 0 20px; max-width: 620px; }
    .stage { position: relative; display: grid; grid-template-columns: 250px 1fr; gap: 10px; padding: 10px; min-height: 330px; border-radius: 16px;
      background: rgba(0, 0, 0, .22); box-shadow: inset 0 0 0 1px var(--faint); }
    .mock { display: flex; flex-direction: column; gap: 6px; }
    .mock .tabs { min-height: 20px; }
    .mock .pinned { min-height: 0; }
    .mock .line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; margin: 4px 2px; }
    .mock .line::before, .mock .line::after { content: ""; flex: 1; border-top: 1px solid var(--faint); }
    .mock .line button { padding: 2px 8px; font-size: 11px; color: var(--c2); }
    .preview { border-radius: 10px; background: #f4f1ea; color: #22262b; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
    .preview small { color: #6b7076; letter-spacing: .06em; font-size: 10px; font-weight: 600; }
    .preview h3 { margin: 0; font-size: 18px; }
    .preview pre { margin: 6px 0 0; font: 12px/1.6 "Segoe UI", system-ui, sans-serif; white-space: pre-wrap; color: #4a4f55; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { border-radius: 10px; background: #f4f1ea; color: #22262b; padding: 16px; min-height: 150px; box-shadow: 0 0 0 2px transparent; transition: box-shadow var(--selection) ease-in-out; }
    .card.focus { box-shadow: 0 0 0 2px var(--c2); }
    .card h3 { margin: 0 0 6px; font-size: 15px; }
    .card p { margin: 0 0 12px; color: #5d636b; font-size: 12px; }
    .card .row-btns { display: flex; gap: 6px; }
    .card button { padding: 5px 10px; border-radius: 8px; background: rgba(0, 0, 0, .07); color: #22262b; font-size: 12px; }
    .task { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--faint); }
    .task .check { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--muted); flex: none; display: grid; place-items: center; transition: background-color var(--selection) ease-in-out; }
    .task.done .check { background: var(--c2); box-shadow: none; color: var(--c0); }
    .task .check svg { width: 12px; height: 12px; opacity: 0; }
    .task.done .check svg { opacity: 1; }
    .task .text { flex: 1; }
    .btn { padding: 8px 14px; border-radius: 10px; background: var(--faint); font-weight: 600; }
    .btn.primary { background: var(--c2); color: var(--c0); }
    .nav { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
    .nav .count { color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; }
    .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
    kbd { font: 600 11px "Segoe UI", system-ui, sans-serif; padding: 2px 6px; border-radius: 5px; background: var(--faint); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .3); }
    a.peek-link { color: var(--c2); }
    .ctx { position: absolute; }
  </style>
</head>
<body>
  <div id="banner" class="banner" aria-hidden="true"><div class="p-mid"></div><div class="p-low"></div></div>
  <div class="page" style="position: relative">
    <nav class="chapters" id="chapters"></nav>
    <section class="lesson" id="lesson"></section>
  </div>
  <script src="houses.js"></script>
  <script src="motion.js"></script>
  <script src="guide.js"></script>
</body>
</html>
