[package]
name = "blazon"
version = "0.1.2"
description = "Blazon - a lightweight Windows browser with Spaces and heraldic crests"
edition = "2021"
license = "MPL-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_WinRT", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Security_Credentials_UI", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Foundation"] }
windows-core = "0.62"
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
