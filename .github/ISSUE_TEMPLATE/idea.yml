name: Ideia ou pedido
description: Algo que o Blazon poderia fazer ou fazer melhor.
labels: [ideia]
body:
  - type: textarea
    id: idea
    attributes:
      label: A ideia
      description: O que você gostaria e em que situação usaria.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Como você faz hoje
      description: Em outro navegador ou dando a volta no Blazon.
