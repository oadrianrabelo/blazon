name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Optional code signing: add these repository secrets to sign the installers.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Ad blocking lists bundled with the installer (refreshed weekly at runtime).
      - name: Download filter lists
        shell: bash
        run: |
          mkdir -p src-tauri/adblock
          curl -sSfL -o src-tauri/adblock/easylist.txt https://easylist.to/easylist/easylist.txt
          curl -sSfL -o src-tauri/adblock/easyprivacy.txt https://easylist.to/easylist/easyprivacy.txt
      - name: Test UI logic
        run: node --test tests/ui.test.mjs
      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked
      - run: npx tauri build
      - name: Sign installers
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files.FullName
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: blazon-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      # A merge to main releases the version in tauri.conf.json once: it creates
      # the v<version> tag and Release when they don't exist yet.
      - name: Check for a new version
        id: version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Blazon ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Installs the build on a clean Windows machine, opens Blazon, walks through
  # its main screens and saves screenshots (artifact "blazon-screenshots").
  smoke:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: blazon-windows
          path: dist
      - name: Install Blazon
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          Start-Process -Wait $setup.FullName -ArgumentList '/S'
          $dirs = "$env:LOCALAPPDATA\Blazon", "$env:LOCALAPPDATA\Programs\Blazon" | Where-Object { Test-Path $_ }
          $exe = Get-ChildItem $dirs -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $exe) { throw 'Blazon.exe não encontrado depois da instalação' }
          Write-Host "Instalado em $($exe.FullName)"
          "BLAZON_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - run: npm install --no-save playwright-core@1.56.1
      - name: Open Blazon and take screenshots
        run: node tests/smoke/run.mjs "${{ env.BLAZON_EXE }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blazon-screenshots
          path: screenshots
